<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Contoh layar: EXPLAIN">
  <rect width="960" height="600" rx="14" fill="#0f172a"/>
  <rect width="960" height="56" rx="14" fill="#1e293b"/>
  <rect y="42" width="960" height="14" fill="#1e293b"/>
  <circle cx="30" cy="28" r="7" fill="#f87171"/>
  <circle cx="56" cy="28" r="7" fill="#fbbf24"/>
  <circle cx="82" cy="28" r="7" fill="#4ade80"/>
  <text x="116" y="34" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="16">EXPLAIN</text>
  <text x="44" y="116" fill="#94a3b8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">-- sebelum indeks</text>
  <text x="44" y="148" fill="#67e8f9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">mysql&gt; EXPLAIN SELECT * FROM pasien WHERE nama LIKE 'A%';</text>
  <text x="44" y="180" fill="#f87171" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">type: ALL   rows: 4120   key: NULL</text>
  <text x="44" y="212" fill="#e2e8f0" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18"></text>
  <text x="44" y="244" fill="#94a3b8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">-- sesudah indeks</text>
  <text x="44" y="276" fill="#67e8f9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">mysql&gt; EXPLAIN SELECT * FROM pasien WHERE nama LIKE 'A%';</text>
  <text x="44" y="308" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">type: range rows: 87     key: idx_pasien_nama</text>
  <text x="44" y="340" fill="#e2e8f0" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18"></text>
  <text x="44" y="372" fill="#fbbf24" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">Extra: Using index condition</text>
  <text x="44" y="404" fill="#e2e8f0" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18"></text>
  <text x="44" y="436" fill="#67e8f9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">mysql&gt; SHOW INDEX FROM kunjungan;</text>
  <text x="44" y="468" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">idx_kunjungan_tanggal  tanggal</text>
</svg>
