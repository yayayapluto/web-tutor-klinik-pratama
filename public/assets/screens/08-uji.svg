<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Contoh layar: sepuluh skenario">
  <rect width="960" height="600" rx="14" fill="#0f172a"/>
  <rect width="960" height="56" rx="14" fill="#1e293b"/>
  <rect y="42" width="960" height="14" fill="#1e293b"/>
  <circle cx="30" cy="28" r="7" fill="#f87171"/>
  <circle cx="56" cy="28" r="7" fill="#fbbf24"/>
  <circle cx="82" cy="28" r="7" fill="#4ade80"/>
  <text x="116" y="34" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="16">sepuluh skenario</text>
  <text x="44" y="116" fill="#fbbf24" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">Panduan kueri, 10 skenario</text>
  <text x="44" y="148" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">1  daftar pasien baru bulan ini        ok</text>
  <text x="44" y="180" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">2  kunjungan per poli                 ok</text>
  <text x="44" y="212" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">3  kunjungan tanggal tertentu         ok</text>
  <text x="44" y="244" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">4  pasien tanpa kunjungan ulang       ok</text>
  <text x="44" y="276" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">5  obat stok di bawah lima            ok</text>
  <text x="44" y="308" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">6  pendapatan per jenis pembayaran    ok</text>
  <text x="44" y="340" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">7  dokter paling sibuk                ok</text>
  <text x="44" y="372" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">8  jadwal besok                       ok</text>
  <text x="44" y="404" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">9  pembayaran belum lunas             ok</text>
  <text x="44" y="436" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">10 pasien dengan kunjungan terbanyak  ok</text>
</svg>
