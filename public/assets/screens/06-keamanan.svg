<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Contoh layar: SHOW GRANTS">
  <rect width="960" height="600" rx="14" fill="#0f172a"/>
  <rect width="960" height="56" rx="14" fill="#1e293b"/>
  <rect y="42" width="960" height="14" fill="#1e293b"/>
  <circle cx="30" cy="28" r="7" fill="#f87171"/>
  <circle cx="56" cy="28" r="7" fill="#fbbf24"/>
  <circle cx="82" cy="28" r="7" fill="#4ade80"/>
  <text x="116" y="34" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="16">SHOW GRANTS</text>
  <text x="44" y="116" fill="#67e8f9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">mysql&gt; SHOW GRANTS FOR 'kasir_klinik'@'localhost';</text>
  <text x="44" y="148" fill="#e2e8f0" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">+------------------------------------------------------+</text>
  <text x="44" y="180" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">| GRANT SELECT, INSERT ON klinik_pratama.pasien TO ...  |</text>
  <text x="44" y="212" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">| GRANT SELECT, INSERT ON klinik_pratama.kunjungan ...  |</text>
  <text x="44" y="244" fill="#4ade80" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">| GRANT SELECT, INSERT ON klinik_pratama.pembayaran ... |</text>
  <text x="44" y="276" fill="#e2e8f0" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">+------------------------------------------------------+</text>
  <text x="44" y="308" fill="#e2e8f0" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18"></text>
  <text x="44" y="340" fill="#67e8f9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">mysql&gt; DELETE FROM pasien WHERE id = 1;</text>
  <text x="44" y="372" fill="#f87171" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="18">ERROR 1142 (42000): DELETE command denied to user</text>
</svg>
